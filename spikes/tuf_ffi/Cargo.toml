[package]
name = "elisapkg-tuf-ffi-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
hex = "0.4"
jiff = { version = "0.2", default-features = false }
serde_json = "1.0"
sigstore-tuf = { git = "https://github.com/sigstore/sigstore-rust", rev = "79d8597006987309930ed3b286f58668adee43cd", default-features = false }
sigstore-crypto = { git = "https://github.com/sigstore/sigstore-rust", rev = "79d8597006987309930ed3b286f58668adee43cd" }

[profile.release]
panic = "unwind"
