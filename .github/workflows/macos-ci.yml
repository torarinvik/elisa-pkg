name: macOS ARM64 CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ELISA_COMPILER_SHA: f0d9e9c70da95933a8ce62ee004e0ac048f50301
  ELISA_CORE_SHA: 68c06b4e0eb1306585ba40d1447b91366e03fdca
  ELISA_GO_VERSION: 1.25.0
  ELISA_LLVM_VERSION: 23.1.1

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Seeded toolchain and required sandbox tests
    runs-on: macos-15
    timeout-minutes: 90
    env:
      ELISAPKG_REQUIRE_SANDBOX_TESTS: "1"
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local

    steps:
      - name: Check out elisapkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Verify source policy and compiler timeout
        run: |
          python3 scripts/check_source_layout.py
          python3 scripts/ffi_boundary_test.py
          python3 scripts/compiler_rebuild_timeout_regression.py

      - name: Select pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.ELISA_GO_VERSION }}
          cache: false

      - name: Fetch pinned Elisa compiler and core sources
        shell: bash
        run: |
          set -euo pipefail
          toolchain_root="$RUNNER_TEMP/elisapkg-toolchain"
          mkdir -p "$toolchain_root"
          printf 'ELISA_COMPILER_ROOT=%s\n' "$toolchain_root/Elisa-compiler" >> "$GITHUB_ENV"
          printf 'ELISA_CORE=%s\n' "$toolchain_root/Elisa-core" >> "$GITHUB_ENV"
          printf 'ELISACORE_BIN=%s\n' "$toolchain_root/Elisa-core/compiler/bin/elisac" >> "$GITHUB_ENV"
          printf 'ELISA_RUNTIME_OBJ=%s\n' "$toolchain_root/Elisa-compiler/build/runtime/elisacore_runtime.o" >> "$GITHUB_ENV"
          printf 'ELISA_STAGE1_BIN=%s\n' "$toolchain_root/Elisa-compiler/bin/elisac-stage1" >> "$GITHUB_ENV"
          printf 'ELISA_COMPILER_WRAPPER=%s\n' "$toolchain_root/Elisa-compiler/scripts/elisac_stage1.sh" >> "$GITHUB_ENV"

          git init --quiet "$toolchain_root/Elisa-compiler"
          git -C "$toolchain_root/Elisa-compiler" remote add origin https://github.com/torarinvik/Elisa-compiler.git
          git -C "$toolchain_root/Elisa-compiler" fetch --no-tags --depth=1 origin "$ELISA_COMPILER_SHA"
          git -C "$toolchain_root/Elisa-compiler" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$toolchain_root/Elisa-compiler" rev-parse HEAD)" = "$ELISA_COMPILER_SHA"

          git init --quiet "$toolchain_root/Elisa-core"
          git -C "$toolchain_root/Elisa-core" remote add origin https://github.com/torarinvik/Elisa-core.git
          git -C "$toolchain_root/Elisa-core" fetch --no-tags --depth=1 origin "$ELISA_CORE_SHA"
          git -C "$toolchain_root/Elisa-core" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$toolchain_root/Elisa-core" rev-parse HEAD)" = "$ELISA_CORE_SHA"

      - name: Install and verify LLVM
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm
          llvm_prefix="$(brew --prefix llvm)"
          llvm_config="$llvm_prefix/bin/llvm-config"
          llvm_clang="$llvm_prefix/bin/clang"
          actual_version="$("$llvm_config" --version)"
          test "$actual_version" = "$ELISA_LLVM_VERSION"
          printf 'LLVM_CONFIG=%s\n' "$llvm_config" >> "$GITHUB_ENV"
          printf 'ELISA_CLANG=%s\n' "$llvm_clang" >> "$GITHUB_ENV"
          printf 'ELISA_LLVM_BIN_DIR=%s/bin\n' "$llvm_prefix" >> "$GITHUB_ENV"
          go version
          "$llvm_config" --version
          xcodebuild -version

      - name: Prepare empty compiler caches
        shell: bash
        run: |
          set -euo pipefail
          cache_root="$RUNNER_TEMP/elisapkg-fresh-compiler-caches"
          mkdir -p "$cache_root/go" "$cache_root/smt"
          chmod 700 "$cache_root" "$cache_root/go" "$cache_root/smt"
          python3 - "$cache_root/go" "$cache_root/smt" <<'PY'
          from pathlib import Path
          import sys

          for raw in sys.argv[1:]:
              path = Path(raw)
              if any(path.iterdir()):
                  raise SystemExit(f"compiler cache is not empty: {path}")
          PY
          printf 'ELISAPKG_FRESH_COMPILER_CACHE_ROOT=%s\n' "$cache_root" >> "$GITHUB_ENV"

      - name: Build stage0 compiler
        shell: bash
        run: |
          set -euo pipefail
          export GOCACHE="$ELISAPKG_FRESH_COMPILER_CACHE_ROOT/go"
          python3 scripts/compiler_rebuild_timeout.py -- make -C "$ELISA_CORE/compiler" build

      - name: Seed stage1 compiler
        shell: bash
        run: |
          set -euo pipefail
          export ELISACORE_SMT_CACHE_DIR="$ELISAPKG_FRESH_COMPILER_CACHE_ROOT/smt"
          export ELISACORE_RETAINED_SERVER=
          python3 scripts/compiler_rebuild_timeout.py -- "$ELISA_COMPILER_ROOT/scripts/elisac_stage1.sh" --seed

      - name: Build runtime from pinned Elisa sources
        run: '"$ELISA_COMPILER_ROOT/scripts/build_runtime_object.sh"'

      - name: Run package-manager build and full regression suite
        env:
          ELISA_ALLOW_STALE_STAGE1: "0"
        run: ./scripts/test.sh

      - name: Create tested main-branch build candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 scripts/build_provenance.py

      - name: Upload tested build candidate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elisapkg-build-candidate
          path: |
            build/elisapkg
            build/release-candidate/elisapkg.provenance.json
            build/release-candidate/elisapkg-macos-arm64.tar.gz
            build/release-candidate/elisapkg-macos-arm64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  attest_main_build:
    name: Verify and attest main-branch build
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download tested candidate files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: elisapkg-build-candidate
          path: build

      - name: Validate source, toolchain pins, binary, and archive
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_REVISION: ${{ github.sha }}
          EXPECTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_COMPILER_REVISION: ${{ env.ELISA_COMPILER_SHA }}
          EXPECTED_CORE_REVISION: ${{ env.ELISA_CORE_SHA }}
          EXPECTED_GO_VERSION: ${{ env.ELISA_GO_VERSION }}
          EXPECTED_LLVM_VERSION: ${{ env.ELISA_LLVM_VERSION }}
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import stat
          import struct
          import tarfile
          import zlib

          candidate = Path("build")
          binary = candidate / "elisapkg"
          release = candidate / "release-candidate"
          manifest_path = release / "elisapkg.provenance.json"
          archive_path = release / "elisapkg-macos-arm64.tar.gz"
          checksum_path = release / "elisapkg-macos-arm64.tar.gz.sha256"

          def fail(message):
              raise SystemExit(f"error: candidate validation failed: {message}")

          def sha256(data):
              return hashlib.sha256(data).hexdigest()

          def require_directory(path):
              try:
                  info = path.lstat()
              except OSError as error:
                  fail(f"candidate directory is unavailable: {path}: {error}")
              if not stat.S_ISDIR(info.st_mode):
                  fail(f"candidate path is not a real directory: {path}")

          def require_regular_file(path, maximum_size):
              try:
                  info = path.lstat()
              except OSError as error:
                  fail(f"candidate file is unavailable: {path}: {error}")
              if not stat.S_ISREG(info.st_mode) or info.st_size > maximum_size:
                  fail(f"candidate file is not regular or exceeds its size limit: {path}")
              return info

          def reject_duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      fail("manifest contains duplicate JSON keys")
                  value[key] = item
              return value

          def require_object(value, label):
              if not isinstance(value, dict):
                  fail(f"manifest {label} must be a JSON object")
              return value

          def require_file_record(value, label):
              record = require_object(value, label)
              digest = record.get("sha256")
              size = record.get("size_bytes")
              if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
                  fail(f"manifest {label} has an invalid SHA-256 digest")
              if type(size) is not int or size <= 0:
                  fail(f"manifest {label} has an invalid size")

          def reject_nonfinite(value):
              fail(f"manifest contains a nonfinite JSON value: {value}")

          require_directory(candidate)
          require_directory(release)
          binary_info = require_regular_file(binary, 128 * 1024 * 1024)
          require_regular_file(manifest_path, 1024 * 1024)
          require_regular_file(archive_path, 256 * 1024 * 1024)
          require_regular_file(checksum_path, 256)

          binary_bytes = binary.read_bytes()
          if len(binary_bytes) < 32 or struct.unpack_from("<II", binary_bytes) != (0xFEEDFACF, 0x0100000C) or struct.unpack_from("<I", binary_bytes, 12)[0] != 2:
              fail("tested binary must have a macOS ARM64 Mach-O executable header")
          manifest_bytes = manifest_path.read_bytes()
          manifest = require_object(json.loads(
              manifest_bytes, object_pairs_hook=reject_duplicate_keys, parse_constant=reject_nonfinite
          ), "root")
          canonical = (json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n").encode()
          if canonical != manifest_bytes or type(manifest.get("schema_version")) is not int or manifest["schema_version"] != 1:
              fail("manifest is not canonical schema version 1")
          source = require_object(manifest.get("source"), "source")
          builder = require_object(manifest.get("builder"), "builder")
          toolchain = require_object(manifest.get("toolchain"), "toolchain")
          artifact = require_object(manifest.get("artifact"), "artifact")
          platform = require_object(builder.get("platform"), "builder platform")
          compiler = require_object(toolchain.get("elisa_compiler"), "Elisa compiler")
          core = require_object(toolchain.get("elisa_core"), "Elisa core")
          go = require_object(toolchain.get("go"), "Go toolchain")
          llvm = require_object(toolchain.get("llvm"), "LLVM toolchain")
          if source.get("repository") != os.environ["EXPECTED_REPOSITORY"] or source.get("revision") != os.environ["EXPECTED_SOURCE_REVISION"]:
              fail("manifest source repository or commit does not match this workflow run")
          if source.get("ref") != "refs/heads/main" or source.get("event") != "push":
              fail("manifest was not created by a main-branch push")
          if builder.get("run_id") != os.environ["EXPECTED_RUN_ID"] or builder.get("run_attempt") != os.environ["EXPECTED_RUN_ATTEMPT"]:
              fail("manifest does not identify this exact workflow run attempt")
          if builder.get("workflow") != os.environ["EXPECTED_WORKFLOW_REF"]:
              fail("manifest workflow identity does not match this workflow run")
          if platform.get("system") != "macOS" or platform.get("architecture") != "arm64":
              fail("manifest builder platform is not macOS arm64")
          if compiler.get("source_revision") != os.environ["EXPECTED_COMPILER_REVISION"]:
              fail("manifest compiler revision does not match the pinned source")
          if core.get("source_revision") != os.environ["EXPECTED_CORE_REVISION"]:
              fail("manifest core revision does not match the pinned source")
          go_version = go.get("version")
          if not isinstance(go_version, str) or not re.search(r"(?:^|\s)go" + re.escape(os.environ["EXPECTED_GO_VERSION"]) + r"(?:\s|$)", go_version):
              fail("manifest Go version does not match the configured toolchain")
          if llvm.get("version") != os.environ["EXPECTED_LLVM_VERSION"]:
              fail("manifest LLVM version does not match the configured toolchain")
          for records, key in (
              (compiler, "wrapper"), (compiler, "stage1"), (core, "stage0"),
              (toolchain, "runtime_object"), (go, "executable"), (llvm, "clang"), (llvm, "llvm_config"),
          ):
              require_file_record(records.get(key), key)
          if (
              artifact.get("name") != "elisapkg"
              or artifact.get("file") != "elisapkg"
              or type(artifact.get("size_bytes")) is not int
              or artifact.get("size_bytes") != len(binary_bytes)
              or artifact.get("mode") != "0755"
              or artifact.get("sha256") != sha256(binary_bytes)
          ):
              fail("manifest executable digest does not match the tested binary")
          if binary_info.st_size != len(binary_bytes):
              fail("tested binary changed while it was read")

          expected_checksum = f"{sha256(archive_path.read_bytes())}  {archive_path.name}\n"
          if checksum_path.read_text(encoding="ascii") != expected_checksum:
              fail("archive checksum does not match the candidate")
          def verify_entry(stream, name, payload, mode):
              entry = tarfile.TarInfo(name)
              entry.size = len(payload)
              entry.mode = mode
              entry.uid = entry.gid = entry.mtime = 0
              entry.uname = entry.gname = "root"
              entry.type = tarfile.REGTYPE
              if stream.read(tarfile.BLOCKSIZE) != entry.tobuf(format=tarfile.USTAR_FORMAT):
                  fail(f"archive has a noncanonical {name} header")
              for offset in range(0, len(payload), 1024 * 1024):
                  expected = payload[offset:offset + 1024 * 1024]
                  if stream.read(len(expected)) != expected:
                      fail(f"archive {name} differs from the tested candidate")
              verify_padding(stream, -len(payload) % tarfile.BLOCKSIZE)

          def verify_padding(stream, size):
              if stream.read(size) != bytes(size):
                  fail("archive has missing or nonzero tar padding")

          try:
              with gzip.open(archive_path, "rb") as expanded:
                  verify_entry(expanded, "elisapkg", binary_bytes, 0o755)
                  verify_entry(expanded, "elisapkg.provenance.json", manifest_bytes, 0o644)
                  verify_padding(expanded, 2 * tarfile.BLOCKSIZE)
                  verify_padding(expanded, -expanded.tell() % tarfile.RECORDSIZE)
                  if expanded.read(1):
                      fail("archive expands beyond the expected tar size")
          except (gzip.BadGzipFile, EOFError, zlib.error) as error:
              fail(f"invalid gzip stream: {error}")
          PY

      - name: Attest tested executable, manifest, and archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/elisapkg
            build/release-candidate/elisapkg.provenance.json
            build/release-candidate/elisapkg-macos-arm64.tar.gz
            build/release-candidate/elisapkg-macos-arm64.tar.gz.sha256
